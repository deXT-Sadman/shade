name: shade
description: A secure, private, end-to-end encrypted messaging application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.5.0+1
  socket_io_client: ^2.0.3+1

  # Environment Config
  flutter_dotenv: ^5.1.0

  # Security / E2EE
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  encrypt: ^5.0.3

  # Dependency Injection
  get_it: ^7.7.0

  # Utilities
  dartz: ^0.10.1
  internet_connection_checker_plus: ^2.5.1
  google_sign_in: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/